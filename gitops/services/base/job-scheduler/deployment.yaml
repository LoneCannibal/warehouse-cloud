apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-scheduler
  labels:
    app.kubernetes.io/name: job-scheduler
    app.kubernetes.io/part-of: warehouse
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: job-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: job-scheduler
        app.kubernetes.io/part-of: warehouse
    spec:
      serviceAccountName: job-scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: job-scheduler
          image: warehouse/job-scheduler:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: infra-outputs
            - configMapRef:
                name: warehouse-config
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: warehouse-database
                  key: DB_DSN
            - name: DB_POOL_SIZE
              value: "6"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
