apiVersion: apps/v1
kind: Deployment
metadata:
  name: packing
  labels:
    app.kubernetes.io/name: packing
    app.kubernetes.io/part-of: warehouse
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: packing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: packing
        app.kubernetes.io/part-of: warehouse
    spec:
      serviceAccountName: packing
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: packing
          image: warehouse/packing:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: infra-outputs
            - configMapRef:
                name: warehouse-config
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Tasks one pod works on at once. In the cloud each task waits on several
            # network round trips, so two slots left pods idle with a backlog queued and
            # their CPU too low for the HPA to react.
            - name: WORKER_SLOTS
              value: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
