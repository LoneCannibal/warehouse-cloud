apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-intake
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-intake
  minReplicas: 2
  # Six vCPUs are shared by everything, so eight pods of each would not fit.
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
