apiVersion: apps/v1
kind: Deployment
metadata:
  name: picking
  labels:
    app.kubernetes.io/name: picking
    app.kubernetes.io/part-of: warehouse
spec:
  # No replicas field: the HPA owns the count, and a value here would make
  # Argo CD self-heal fight the autoscaler on every sync.
  selector:
    matchLabels:
      app.kubernetes.io/name: picking
  template:
    metadata:
      labels:
        app.kubernetes.io/name: picking
        app.kubernetes.io/part-of: warehouse
    spec:
      serviceAccountName: picking
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: picking
          image: warehouse/picking:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: infra-outputs
            - configMapRef:
                name: warehouse-config
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ROUTE_STOPS
              value: "90"
            # Tasks one pod works on at once. In the cloud each task waits on several
            # network round trips, so two slots left pods idle with a backlog queued and
            # their CPU too low for the HPA to react.
            - name: WORKER_SLOTS
              value: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
