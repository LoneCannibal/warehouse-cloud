# Values for kube-prometheus-stack.

# The CRDs come from the monitoring-crds Application, which syncs first. See
# gitops/apps/templates/platform.yaml for why the chart must not install them itself.
crds:
  enabled: false
alertmanager:
  enabled: false

# GKE runs these control-plane components itself and hides them, so scraping them
# only produces errors. kube-proxy only listens on the node's loopback address.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    retention: 3d
    # Pick up ServiceMonitors from every namespace, not only this chart's own.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 150m
        memory: 768Mi
      limits:
        memory: 1536Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi

grafana:
  # Terraform creates this secret from grafana_admin_password in terraform.tfvars, so the
  # password is the same on every `make up` and never passes through Git. Without it the
  # chart would make a new random password each time Argo CD renders it.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # A public address of its own, separate from the shop's: the Ingress can only send
  # traffic to services in its own namespace. scripts/down.sh waits for this load
  # balancer to go before destroying the network, or it would be left billing.
  service:
    type: LoadBalancer
  # Terraform creates this service account, tied through Workload Identity to a Google
  # account that may read Cloud Monitoring and Cloud Logging. No key file is involved.
  serviceAccount:
    create: false
    name: grafana
  plugins:
    - googlecloud-logging-datasource
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  additionalDataSources:
    - name: Cloud Monitoring
      type: stackdriver
      uid: cloud-monitoring
      access: proxy
      jsonData:
        authenticationType: gce
    - name: Cloud Logging
      type: googlecloud-logging-datasource
      # The Central Logs dashboard refers to this data source by uid.
      uid: cloud-logging
      access: proxy
      jsonData:
        authenticationType: gce
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
