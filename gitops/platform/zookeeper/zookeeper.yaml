# A three-node ensemble. Writes need a majority, so it survives losing any one node.
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  labels:
    app.kubernetes.io/name: zookeeper
spec:
  clusterIP: None
  # Peers must find each other before any of them is ready, or quorum never forms.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: zookeeper
  ports:
    - name: client
      port: 2181
    - name: peer
      port: 2888
    - name: election
      port: 3888
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-metrics
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/component: metrics
spec:
  selector:
    app.kubernetes.io/name: zookeeper
  ports:
    - name: metrics
      port: 7000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zookeeper
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
spec:
  serviceName: zookeeper-headless
  replicas: 3
  # OrderedReady would deadlock: the first pod cannot be ready without a quorum.
  podManagementPolicy: Parallel
  # Removes the EBS volumes with the app, so `make down` leaves nothing billing.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
    spec:
      securityContext:
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          # Two ensemble members on one node would make that node a quorum risk.
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: zookeeper
      containers:
        - name: zookeeper
          image: zookeeper:3.9.6
          command:
            - bash
            - -c
            # myid must be unique per server, and the ordinal in the pod name gives that.
            - export ZOO_MY_ID=$(( ${HOSTNAME##*-} + 1 )); exec /docker-entrypoint.sh zkServer.sh start-foreground
          env:
            - name: ZOO_SERVERS
              value: >-
                server.1=zookeeper-0.zookeeper-headless.warehouse.svc.cluster.local:2888:3888;2181
                server.2=zookeeper-1.zookeeper-headless.warehouse.svc.cluster.local:2888:3888;2181
                server.3=zookeeper-2.zookeeper-headless.warehouse.svc.cluster.local:2888:3888;2181
            - name: ZOO_CFG_EXTRA
              value: >-
                quorumListenOnAllIPs=true
                metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider
                metricsProvider.httpPort=7000
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: srvr,mntr,ruok
            - name: ZOO_AUTOPURGE_PURGEINTERVAL
              value: "1"
            - name: ZOO_ADMINSERVER_ENABLED
              value: "false"
            - name: JVMFLAGS
              value: -Xmx384m
          ports:
            - name: client
              containerPort: 2181
            - name: peer
              containerPort: 2888
            - name: election
              containerPort: 3888
            - name: metrics
              containerPort: 7000
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - echo ruok | nc -w 2 localhost 2181 | grep -q imok
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: data
            - name: data
              mountPath: /datalog
              subPath: datalog
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # GKE's balanced persistent disk class. 10Gi is its smallest size.
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 10Gi
