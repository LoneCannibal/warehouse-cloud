# The whole system on one machine, with no Google Cloud project.
#
#   docker compose up --build -d
#   BASE_URL=http://localhost:8080 ./scripts/smoke.sh
#
# What stands in for what:
#   Managed Kafka            Kafka in one container, without TLS or sign-in
#   Cloud SQL                PostgreSQL in one container
#   Cloud Storage            fake-gcs-server, which also publishes the manifest notifications
#   Pub/Sub, Firestore       Google's own emulators
#   Cloud Run function       dispatch-function/local_runner.py, which pulls from Pub/Sub
#                            and calls the same handler a push delivery would
#   Dataproc                 a Flink 1.17 JobManager and TaskManager
#   GKE, load balancer       Docker networking, with order-intake published on port 8080

x-env: &env
  KAFKA_BOOTSTRAP: kafka:9092
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  ZK_HOSTS: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
  DB_DSN: postgresql://warehouse:warehouse@postgres:5432/warehouse
  KAFKA_AUTH: none
  GCP_PROJECT: local-project
  STORAGE_EMULATOR_HOST: http://fake-gcs:4443
  PUBSUB_EMULATOR_HOST: pubsub:8085
  FIRESTORE_EMULATOR_HOST: firestore:8086
  DATA_BUCKET: warehouse-data
  DISPATCH_SUBSCRIPTION: warehouse-dispatch
  INVENTORY_TARGET: dns:///inventory:50051
  WORKERS_TARGET: dns:///worker-registry:50051
  # Both scheduler containers answer to this alias, like the headless Service on GKE.
  SCHEDULER_TARGET: dns:///job-scheduler:50051
  SCHEDULER_URL: http://job-scheduler:8080

x-service-depends: &service-depends
  init:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  zookeeper-1:
    condition: service_healthy
  zookeeper-2:
    condition: service_healthy
  zookeeper-3:
    condition: service_healthy
  firestore:
    condition: service_healthy

x-zookeeper: &zookeeper
  image: zookeeper:3.9.6
  healthcheck:
    test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
    interval: 5s
    retries: 20

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 3s
      retries: 20

  zookeeper-1:
    <<: *zookeeper
    environment: &zoo-env
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper-1:2888:3888;2181 server.2=zookeeper-2:2888:3888;2181 server.3=zookeeper-3:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: srvr,mntr,ruok
      ZOO_CFG_EXTRA: quorumListenOnAllIPs=true
    ports:
      - "2181:2181"

  zookeeper-2:
    <<: *zookeeper
    environment:
      <<: *zoo-env
      ZOO_MY_ID: 2

  zookeeper-3:
    <<: *zookeeper
    environment:
      <<: *zoo-env
      ZOO_MY_ID: 3

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 20

  # Publishes a notification for each new manifest, as Cloud Storage does.
  fake-gcs:
    image: fsouza/fake-gcs-server:1.56.1
    command:
      - -scheme=http
      - -port=4443
      - -external-url=http://fake-gcs:4443
      - -event.pubsub-project-id=local-project
      - -event.pubsub-topic=warehouse-manifests
      - -event.object-prefix=manifests/
      - -event.list=finalize
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
    depends_on:
      - pubsub

  pubsub:
    image: &emulators gcr.io/google.com/cloudsdktool/google-cloud-cli:592.0.0-emulators
    command: gcloud beta emulators pubsub start --project=local-project --host-port=0.0.0.0:8085
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085 > /dev/null"]
      interval: 3s
      retries: 30

  firestore:
    image: *emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8086
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086 > /dev/null"]
      interval: 3s
      retries: 30

  # Creates what Terraform creates on Google Cloud: topics first, then the bucket and Pub/Sub.
  init:
    build:
      context: .
      dockerfile: services/Dockerfile.init
    environment: *env
    restart: on-failure:10
    depends_on:
      kafka:
        condition: service_healthy
      fake-gcs:
        condition: service_started
      pubsub:
        condition: service_healthy

  inventory:
    restart: on-failure
    build: &python-build
      context: .
      dockerfile: services/Dockerfile.python
      args:
        SERVICE: inventory
    environment: *env
    depends_on: *service-depends

  order-intake:
    restart: on-failure
    build:
      <<: *python-build
      args:
        SERVICE: order-intake
    environment: *env
    depends_on: *service-depends
    ports:
      - "8080:8080"

  worker-registry:
    restart: on-failure
    build:
      <<: *python-build
      args:
        SERVICE: worker-registry
    environment: *env
    depends_on: *service-depends

  job-scheduler-1:
    build: &scheduler-build
      <<: *python-build
      args:
        SERVICE: job-scheduler
    environment:
      <<: *env
      WORKER_ID: job-scheduler-1
      DB_POOL_SIZE: 6
    depends_on: *service-depends
    restart: on-failure
    networks:
      default:
        aliases:
          - job-scheduler

  job-scheduler-2:
    build: *scheduler-build
    environment:
      <<: *env
      WORKER_ID: job-scheduler-2
      DB_POOL_SIZE: 6
    depends_on: *service-depends
    restart: on-failure
    networks:
      default:
        aliases:
          - job-scheduler

  picking:
    restart: on-failure
    build:
      <<: *python-build
      args:
        SERVICE: picking
    environment: *env
    depends_on: *service-depends
    deploy:
      replicas: 2

  packing:
    restart: on-failure
    build:
      <<: *python-build
      args:
        SERVICE: packing
    environment: *env
    depends_on: *service-depends

  analytics-api:
    restart: on-failure
    build:
      <<: *python-build
      args:
        SERVICE: analytics-api
    environment: *env
    depends_on: *service-depends
    ports:
      - "8090:8080"

  dispatch-local:
    restart: on-failure
    build:
      context: services/dispatch-function
      dockerfile: Dockerfile.local
    environment: *env
    depends_on: *service-depends

  flink-jobmanager:
    image: flink:1.17-java11
    command: jobmanager
    environment: &flink-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
    ports:
      - "8081:8081"

  flink-taskmanager:
    image: flink:1.17-java11
    command: taskmanager
    environment: *flink-env
    depends_on:
      - flink-jobmanager

  # Builds the JAR and submits it, as the Dataproc job does on Google Cloud.
  flink-submit:
    build:
      context: services/analytics-flink
      dockerfile: Dockerfile.local
    restart: on-failure:10
    depends_on:
      init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    command:
      - flink
      - run
      - -d
      - -m
      - flink-jobmanager:8081
      - /opt/analytics-flink.jar
      - --bootstrap
      - kafka:9092
      - --window-seconds
      - "60"
